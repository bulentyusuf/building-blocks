name: llms.txt link check

on:
  pull_request:
    branches: [main]
    paths:
      - "public/llms.txt"
      - "scripts/check-llms-links.mjs"
      - ".github/workflows/llms-link-check.yml"
  schedule:
    # Weekly, so a slug renamed in the CMS is caught even when no PR touches the file.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Reads engines.node — the single Node version pin. See CLAUDE.md.
          node-version-file: package.json

      - name: Check llms.txt links
        run: node scripts/check-llms-links.mjs
        env:
          SITE_URL: https://beuseful.net
