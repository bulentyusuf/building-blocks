name: llms.txt link check

on:
  pull_request:
    branches: [main]
    paths:
      - "public/llms.txt"
      - "scripts/check-llms-links.mjs"
      - ".github/workflows/llms-link-check.yml"
  schedule:
    # Weekly, so a slug renamed in the CMS is caught even when no PR touches the file.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Reads engines.node — the single Node version pin. See CLAUDE.md.
          node-version-file: package.json

      - name: Check llms.txt links
        run: node scripts/check-llms-links.mjs
        env:
          SITE_URL: https://beuseful.net
